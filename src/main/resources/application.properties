spring.profiles.active=prod

spring.application.name=Small_Business_BE

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

file.photo-dir=//Wolke1/Test1/SmallBusiness/uploads/photos
file.document-dir=//Wolke1/Test1/SmallBusiness/uploads/documents
spring.web.resources.static-locations=file://Wolke1/Test1/SmallBusiness/uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-post-size=10485760

server.servlet.session.timeout=30m
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.file.name=//Wolke1/Test1/SmallBusiness/logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n