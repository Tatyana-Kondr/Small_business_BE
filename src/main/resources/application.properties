spring.application.name=Small_Business_BE

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-post-size=10485760

server.servlet.session.timeout=30m

jwt.access.expiration.ms=300000

app.uploads.logos=${app.uploads.root}/logos
app.uploads.photos=${app.uploads.root}/photos
app.uploads.documents=${app.uploads.root}/documents
app.uploads.products=${app.uploads.root}/products

file.photo-dir=${app.uploads.photos}
file.document-dir=${app.uploads.documents}
